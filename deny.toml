[graph]
all-features = true

[advisories]
ignore = [
  { id = "RUSTSEC-2021-0139", reason = "ansi_term, through tracing-forest's ansi feature in SP1. SP1 dropping that feature removes it." },
  { id = "RUSTSEC-2021-0141", reason = "dotenv, a direct dependency of the example hosts and a dev dependency of sp1-cc-host-executor. Switching to dotenvy removes it." },
  { id = "RUSTSEC-2024-0320", reason = "yaml-rust, through serde_yaml 0.8 in the ethereum-consensus fork. ethereum-consensus must upgrade serde_yaml first." },
  { id = "RUSTSEC-2024-0436", reason = "paste, through several crates, including alloy-primitives and ark-ff. Each one must drop it first." },
  { id = "RUSTSEC-2025-0119", reason = "number_prefix, through indicatif 0.17 in SP1. SP1 must upgrade indicatif first." },
  { id = "RUSTSEC-2025-0141", reason = "bincode, used by the examples, sp1-cc-host-executor's tests and most SP1 crates. All must move to a maintained serializer." },
  { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2, through alloy-sol-macro 1.6.0 and dynasm 3 in sp1-jit. Needs alloy-sol-macro 1.6.1 and SP1 on dynasm 5.1." },
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
exceptions = [
  { allow = ["CC0-1.0"], crate = "aurora-engine-modexp" },
  { allow = ["CC0-1.0"], crate = "secp256k1" },
  { allow = ["CC0-1.0"], crate = "secp256k1-sys" },
  { allow = ["CC0-1.0"], crate = "tiny-keccak" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# No required-git-spec: the ethereum-consensus and ssz-rs forks are pinned by branch.
allow-org = { github = ["paradigmxyz", "sp1-patches", "succinctlabs"] }
